# Site settings
title: MarsLink | AI infrastructure for mobility
email: info@marslink.co.jp
description: >-
  MarsLinkは、AIによって移動空間を再設計するインフラ企業です。航空・船舶・鉄道・バスなど、あらゆる移動空間に状況認識と意思決定を支えるAIを届けます。CabinTimeはその最初のプロダクトです。
keywords: "MarsLink, マーズリンク, CabinTime, AIインフラ, 移動空間AI, 機内AI, エッジAI, オフラインAI, 生成AI, AIアシスタント, AIコンシェルジュ, モビリティAI, 旅行AI, 観光AI, 航空, 船舶, 交通, Journey AI, AI infrastructure for mobility"
baseurl: "" # 独自ドメイン公開時は空
url: "https://marslink.co.jp" # 独自ドメイン

# Timezone
timezone: Asia/Tokyo

# Encoding
encoding: utf-8

# Social media handles
twitter_username: marslink_japan
github_username: marslink

# Build settings
markdown: kramdown
highlighter: rouge
theme: 

# Markdown engine options
kramdown:
  input: GFM
  hard_wrap: true

# Include and exclude files
include:
  - "_pages"
  - "assets"

exclude:
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - public_html/
  - public/
  - api/
  - vercel.json
  - .vercelignore
  - PHPMailer/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - deploy.sh
  - PHP_SETUP_GUIDE.md
  - template-usage-example.md
  - base-template.html
  - package.json
  - package-lock.json
  - tailwind.config.js
  - input.css
  - composer.json
  - htaccess.txt
  - .htaccess
  - .htaccess_old
  - .user.ini
  - send_mail.php
  - README.md
  - _backup/
  - docs/
  - "*.bak"
  - "*.backup"
  - "*.old"
  - .htaccess_old
  # Exclude files with non-ASCII filenames causing encoding errors
  - cabintime-demo/assets/img/touris３.jpg
  - "assets/images/スクリーンショット 2025-11-08 10.14.46.png"

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Default values
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "MarsLink"
      permalink: "/post/:title.html"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Draft settings - pages with draft: true will not be published
show_drafts: false

# SEO settings
author: MarsLink
logo: /assets/images/logo.png
social:
  name: MarsLink Inc.
  links:
    - https://twitter.com/marslink_japan

# Analytics (設定時にコメントアウト解除)
google_analytics: G-4GB470X3SK
google_site_verification: "A7Ao6K_9KyyD2MJWgymaOyTS-hsEZyYXIKGvJO1L0nw"
# bing_site_verification: "your-bing-verification-code"

# Sass configuration
sass:
  sass_dir: _sass
  style: compressed 

# Performance optimizations
incremental: true
profile: false
strict_front_matter: true

# Livereload configuration (メモリ最適化)
livereload_port: 35730
livereload_min_delay: 500
livereload_max_delay: 5000

# Limit build size and memory usage
limit_posts: 10
future: false
unpublished: false

# Cache settings
cache_dir: .jekyll-cache 

# Form settings
formspree_id: "" # 例: abcd1234
emailjs_public_key: ""
emailjs_service_id: ""
emailjs_template_id: ""
